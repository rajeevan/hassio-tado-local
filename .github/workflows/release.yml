name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        uses: home-assistant/builder@[version]
        with:
          args: |
            --all \
            --target /data \
            --version  ${{ github.event.release.tag_name || 'latest' }} \
            # --image "${{ github.repository_owner }}/image-{arch}-tado-local" \
            # --docker-hub ghcr.io
  