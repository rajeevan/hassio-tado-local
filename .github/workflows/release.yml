name: Release Package Build

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE_NAME: tado_local

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Increased slightly as emulation can be slow
    strategy:
      matrix:
        arch:
          - amd64
          - aarch64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION=${VERSION#v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and Publish with HA Builder
        uses: home-assistant/builder@2025.11.0
        with:
          args: |
            --${{ matrix.arch }} \
            --target ./tado_local \
            --image ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}_{arch} \
            --version ${{ steps.version.outputs.VERSION }} \
            --docker-user ${{ github.repository_owner }} \
            --docker-password ${{ secrets.GITHUB_TOKEN }} \
            --docker-hub ghcr.io

      - name: Save Docker image as artifact
        run: |
          ARCH="${{ matrix.arch }}"
          TAG="${{ steps.version.outputs.VERSION }}"
          FULL_IMAGE="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}_${ARCH}:${TAG}"
          
          # Pull the image the builder just pushed to save it as a tar
          docker pull $FULL_IMAGE
          docker save $FULL_IMAGE | gzip > tado_local_${ARCH}_${TAG}.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.arch }}-${{ steps.version.outputs.VERSION }}
          path: tado_local_${{ matrix.arch }}_${{ steps.version.outputs.VERSION }}.tar.gz
          retention-days: 30

  package-addon:
    runs-on: ubuntu-latest
    needs: build-and-package
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION=${VERSION#v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Update config.yaml with version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Update version and image reference to use GHCR
          sed -i "s/version: \".*\"/version: \"${VERSION}\"/" tado_local/config.yaml
          sed -i "s|image: \".*\"|image: \"ghcr.io/${{ github.repository_owner }}/tado_local_{arch}\"|" tado_local/config.yaml

      - name: Create add-on package
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p release
          cp -r tado_local release/
          cp repository.json release/
          cd release
          tar czf ../tado_local_addon_${VERSION}.tar.gz *

      - name: Upload add-on package artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-package-${{ steps.version.outputs.VERSION }}
          path: tado_local_addon_${{ steps.version.outputs.VERSION }}.tar.gz
          retention-days: 90

  create-release:
    runs-on: ubuntu-latest
    needs: [build-and-package, package-addon]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}
            
            ### Docker Images (GHCR)
            - `ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}_amd64:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}_aarch64:${{ github.ref_name }}`
            
            ### Installation
            Add this repository to Home Assistant: `https://github.com/${{ github.repository_owner }}/hassio-tado-local`
          files: |
            artifacts/addon-package-*/tado_local_addon_*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attach-artifacts-to-release:
    runs-on: ubuntu-latest
    needs: [build-and-package, package-addon]
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/addon-package-*/tado_local_addon_*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}